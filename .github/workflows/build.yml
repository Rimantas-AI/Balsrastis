name: Build Balsrastis

# Runs on GitHub's free macOS servers. Produces a ready-to-run Balsrastis.app
# you can download from the run's "Artifacts" section — no local compiling.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]       # pushing a tag like v1.0.0 also publishes a Release
  workflow_dispatch:   # lets you trigger a build manually from the Actions tab

jobs:
  build:
    runs-on: macos-15   # macOS Sequoia runner — ships modern Xcode 16 toolchains
    permissions:
      contents: write   # needed to create the GitHub Release on a tag push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        # Pin the newest stable Xcode on the runner so Swift package
        # resolution and the macOS 12 deployment target both stay supported.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      # Apsaugų patikros pirma: jos veikia per sekundes ir tikrina būtent tai,
      # kas saugo naudotojo dokumentą. Nepavykus — statyti nebeverta.
      # Naujas .swift failas kompiliuojasi per `swift build`, bet be įrašo
      # project.pbxproj `xcodebuild` jo nemato. Trys tokie atvejai — užtenka.
      - name: Check every source file is in the Xcode project
        run: ./scripts/check-xcode-sources.sh

      - name: Run guard checks
        run: swift run GuardChecks

      - name: Build (unsigned)
        # Uses -scheme (required alongside -derivedDataPath). The shared scheme
        # lives in Balsrastis.xcodeproj/xcshareddata/xcschemes/. xcodebuild
        # resolves Swift packages automatically when building a scheme.
        run: |
          set -o pipefail
          xcodebuild \
            -project Balsrastis.xcodeproj \
            -scheme Balsrastis \
            -configuration Release \
            -derivedDataPath build \
            MACOSX_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Ad-hoc sign the app
        # An ad-hoc signature lets the app launch on your Mac. Accessibility
        # permission will need re-granting after each new build (the signature
        # changes every time).
        run: |
          APP="build/Build/Products/Release/Balsrastis.app"
          codesign --force --deep --sign - "$APP"
          # No `|| true`: an ad-hoc signature that fails to verify means the
          # zip below is broken, and shipping it silently is worse than a red build.
          codesign --verify --verbose "$APP"

      - name: Zip the app
        run: |
          cd build/Build/Products/Release
          ditto -c -k --keepParent Balsrastis.app Balsrastis.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Balsrastis-app
          path: build/Build/Products/Release/Balsrastis.zip
          if-no-files-found: error

      # On a version tag (e.g. v1.0.0) publish a GitHub Release with a direct,
      # login-free download link. On normal branch pushes this step is skipped.
      - name: Publish Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Balsrastis ${{ github.ref_name }}
          files: build/Build/Products/Release/Balsrastis.zip
          body: |
            ## Balsrastis ${{ github.ref_name }}

            Balso diktavimas lietuviškai — bet kurioje macOS programoje.
            GPT-4o mini Transcribe (OpenAI) + Claude (Anthropic). Meniu juostos programa.

            ### Download & run
            1. Download **Balsrastis.zip** below and unzip → `Balsrastis.app`.
            2. Move it to **Applications**.
            3. First launch (ad-hoc signed) — in Terminal:
               `xattr -dr com.apple.quarantine /Applications/Balsrastis.app`
            4. Grant **Microphone** + **Accessibility** (see README), and enter your
               **OpenAI** and **Claude** API keys in Settings → API Keys.

            Requires macOS 12+ and internet. Full guide: see the repository README.
